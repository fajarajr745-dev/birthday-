<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<!-- WAJIB biar pas di HP -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Firyal 🎂</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* FULL LAYAR HP */
.container {
    width: 100vw;
    height: 100vh;
    position: relative;
}

/* GRID 2x2 */
.grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
}

.grid div {
    background-size: cover;
    background-position: center;
}

/* BUTTON */
button {
    position: fixed;
    z-index: 2;
    padding: 15px 25px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
}

/* POPUP */
.popup {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(255,255,255,0.95);
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    transition: 0.4s;
    z-index: 3;
    width: 85%;
    max-width: 320px;
    max-height: 320px;
    max-height: 80vh;
    overflow-y: auto;
}

.popup.active {
    transform: translate(-50%, -50%) scale(1);
}

/* FOTO */
.photo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
}
</style>
</head>

<body>

<div class="container">

    <!-- GRID 2x2 -->
    <div class="grid">
        <div style="background-image:url('firyal.jpg')"></div>
        <div style="background-image:url('firyal.jpg')"></div>
        <div style="background-image:url('firyal.jpg')"></div>
        <div style="background-image:url('firyal.jpg')"></div>
    </div>

    <!-- BUTTON -->
    <button onclick="showSurprise()">Klik Surprise 🎁</button>

    <!-- POPUP -->
    <div class="popup" id="popup">
        <img src="foto.jpg" class="photo">
        <h2>🎉 Selamat Ulang Tahun 🎉</h2>
        <h3>Firyal Amalia 💖</h3>
        <p class="desc">Semoga panjang umur dan sehat selalu agar bisa jadi supir setia kolay-kolay✨</p>
    </div>

</div>

<!-- AUDIO -->
<audio id="audio">
    <source src="happy-birthday-song-01.mp3" type="audio/mpeg">
</audio>

<script>
function showSurprise() {
    document.getElementById("popup").classList.add("active");

    let audio = document.getElementById("audio");
    audio.currentTime = 0;
    audio.play().catch(() => {
        alert("Klik sekali lagi ya biar musiknya nyala 🎵");
    });
}
</script>

</body>
</html>
