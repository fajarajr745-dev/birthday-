<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Firyal 🎂</title>

<style>
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* BUTTON */
button {
    padding: 20px 40px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* POPUP */
.popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: 0.5s;
    z-index: 10;
    width: 300px;
}

.popup.active {
    transform: translate(-50%, -50%) scale(1);
}

h1 {
    color: #ff4d6d;
}

/* FOTO */
.photo {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #ff4d6d;
    margin-bottom: 15px;
}

/* BALON */
.balloon {
    position: absolute;
    bottom: -150px;
    width: 50px;
    height: 70px;
    border-radius: 50%;
    animation: float 6s infinite;
}

@keyframes float {
    0% { transform: translateY(0); }
    100% { transform: translateY(-120vh); }
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<button onclick="showSurprise()">Klik untuk Surprise 🎁</button>

<div class="popup" id="popup">
    <!-- FOTO -->
    <img src="firyal.jpg" class="photo" alt="Firyal">

    <h1>🎉 Selamat Ulang Tahun 🎉</h1>
    <h2>Firyal Amalia 💖</h2>
    <p>Semoga panjang umur, sehat selalu, dan semua impianmu tercapai ✨</p>
</div>

<!-- AUDIO -->
<audio id="audio" src="https://www.bensound.com/bensound-music/bensound-happyrock.mp3"></audio>

<canvas id="confetti"></canvas>

<script>
function showSurprise() {
    document.getElementById("popup").classList.add("active");
    document.getElementById("audio").play();
    createBalloons();
    startConfetti();
}

// BALON
function createBalloons() {
    for (let i = 0; i < 20; i++) {
        let balloon = document.createElement("div");
        balloon.className = "balloon";
        balloon.style.left = Math.random() * 100 + "vw";
        balloon.style.background = randomColor();
        balloon.style.animationDuration = (Math.random() * 3 + 3) + "s";
        document.body.appendChild(balloon);
    }
}

function randomColor() {
    const colors = ["#ff4d6d", "#f9c74f", "#90dbf4", "#cdb4db", "#80ed99"];
    return colors[Math.floor(Math.random() * colors.length)];
}

// CONFETTI
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let confetti = [];

function startConfetti() {
    for (let i = 0; i < 150; i++) {
        confetti.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 6 + 2,
            d: Math.random() * 5 + 1,
            color: randomColor()
        });
    }
    animateConfetti();
}

function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    confetti.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fillStyle = c.color;
        ctx.fill();

        c.y += c.d;
        if (c.y > canvas.height) {
            c.y = 0;
            c.x = Math.random() * canvas.width;
        }
    });

    requestAnimationFrame(animateConfetti);
}
</script>

</body>
</html>
