<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Firyal 🎂</title>

<style>
body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: black;
    overflow: hidden;
}

/* CONTAINER RASIO HP (9:16) */
.container {
    width: 100%;
    max-width: 400px;
    aspect-ratio: 9 / 16;
    position: relative;
}

/* GRID 2x2 */
.grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
}

.grid div {
    background-size: cover;
    background-position: center;
}

/* BUTTON */
button {
    position: absolute;
    z-index: 2;
    padding: 15px 25px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
}

/* POPUP */
.popup {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(255,255,255,0.95);
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    transition: 0.4s;
    z-index: 3;
    width: 80%;
}

.popup.active {
    transform: translate(-50%, -50%) scale(1);
}

/* FOTO */
.photo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
}
</style>
</head>

<body>

<div class="container">

    <!-- GRID 2x2 -->
    <div class="grid">
        <div style="background-image:url('foto.jpg')"></div>
        <div style="background-image:url('foto.jpg')"></div>
        <div style="background-image:url('foto.jpg')"></div>
        <div style="background-image:url('foto.jpg')"></div>
    </div>

    <button onclick="showSurprise()">Klik Surprise 🎁</button>

    <div class="popup" id="popup">
        <img src="foto.jpg" class="photo">
        <h2>🎉 Selamat Ulang Tahun 🎉</h2>
        <h3>Firyal Amalia 💖</h3>
    </div>

</div>

<audio id="audio" src="happy-birthday.mp3"></audio>

<script>
function showSurprise() {
    document.getElementById("popup").classList.add("active");
    document.getElementById("audio").play();
}
</script>

</body>
</html>
