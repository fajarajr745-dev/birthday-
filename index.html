<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Firyal 🎂</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* GRID BACKGROUND 8x8 */
.grid {
    position: fixed;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    z-index: 0;
}

.grid div {
    border: 1px solid rgba(255,255,255,0.2);
    background-size: cover;
    background-position: center;
}

/* BUTTON */
button {
    position: relative;
    z-index: 2;
    padding: 20px 40px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/* POPUP */
.popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(255,255,255,0.95);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    transition: 0.5s;
    z-index: 3;
}

.popup.active {
    transform: translate(-50%, -50%) scale(1);
}

/* FOTO */
.photo {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<!-- GRID -->
<div class="grid">
    <!-- TOTAL 64 SLOT -->
    <!-- Ganti gambar sesuai file kamu -->
    
    <!-- Baris 1 -->
    <div style="background-image:url('foto.jpg')"></div>
    <div style="background-image:url('foto.jpg')"></div>
    <div style="background-image:url('foto.jpg')"></div>
    <div style="background-image:url('foto.jpg')"></div>
    <div style="background-image:url('foto.jpg')"></div>
    <div style="background-image:url('foto.jpg')"></div>
    <div style="background-image:url('foto.jpg')"></div>
    <div style="background-image:url('foto.jpg')"></div>

    <!-- Baris 2 -->
    <div style="background-image:url('foto.jpg')"></div>
    <div style="background-image:url('foto.jpg')"></div>
    <div style="background-image:url('foto.jpg')"></div>
    <div style="background-image:url('foto.jpg')"></div>
    <div style="background-image:url('foto.jpg')"></div>
    <div style="background-image:url('foto.jpg')"></div>
    <div style="background-image:url('foto.jpg')"></div>
    <div style="background-image:url('foto.jpg')"></div>

    <!-- LANJUT SAMPAI 64 -->
    <!-- Kamu bisa copy baris di atas sampai total 64 -->
</div>

<button onclick="showSurprise()">Klik Surprise 🎁</button>

<div class="popup" id="popup">
    <img src="firyal.jpg" class="photo">
    <h2>🎉 Selamat Ulang Tahun 🎉</h2>
    <h3>Firyal Amalia 💖</h3>
</div>

<audio id="audio" src="happy-birthday.mp3"></audio>

<script>
function showSurprise() {
    document.getElementById("popup").classList.add("active");
    document.getElementById("audio").play();
}
</script>

</body>
</html>
